name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  # Docker actions still ship Node 20; opt their runtime into Node 24 ahead of
  # GitHub forcing the switch on 2026-06-02. Remove once the actions ship Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome check
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The one job that gets a database, and only so `downloadsStore.pg.test.js`
    # can execute the SQL branch of `downloadsStore.js` — the impl production
    # runs, which nothing else in the suite touches (0XC-110). Every other test
    # injects `createMemoryStore()` and stays offline, so this service is
    # additive: with `TEST_DATABASE_URL` unset (a laptop) that one file skips
    # with a reason and the rest of the suite is unchanged.
    #
    # A throwaway container rather than a Neon branch: free, hermetic, no secret
    # and nothing to clean up. The SQL here is plain Postgres with no
    # Neon-specific features, so the fidelity is sufficient.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tubekeep_test
        ports:
          - 5432:5432
        # Without the health gate the steps can start before Postgres accepts
        # connections, and the run fails on a race rather than on a test.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend test suite
        working-directory: backend
        env:
          # Read only by downloadsStore.pg.test.js, which TRUNCATEs `downloads`
          # and `users` between cases — so it must never point at a real database.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tubekeep_test
        run: npm test

  # Named `build` here (there's no docker job in this workflow to collide with);
  # deploy.yml's identical job is named `build-frontend` because deploy.yml's
  # `build` name is already taken by its docker image build.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # The only job that renders a page in a real browser. `lint`/`test`/`build` are
  # all structurally blind to a CSS-cascade or ARIA regression — the invisible
  # focus ring (0XC-111) passed every one of them — so this is the gate for that
  # class of defect. Hermetic: no backend, no database, no yt-dlp, no network
  # beyond localhost (the suite intercepts and aborts anything else).
  frontend-a11y:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Keyed on the lockfile because it pins the exact @playwright/test version,
      # which is what determines the browser build that gets downloaded.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend a11y suite
        working-directory: frontend
        run: npm test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
