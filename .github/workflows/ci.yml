name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  # Docker actions still ship Node 20; opt their runtime into Node 24 ahead of
  # GitHub forcing the switch on 2026-06-02. Remove once the actions ship Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome check
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend test suite
        working-directory: backend
        run: npm test

  # Named `build` here (there's no docker job in this workflow to collide with);
  # deploy.yml's identical job is named `build-frontend` because deploy.yml's
  # `build` name is already taken by its docker image build.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # The only job that renders a page in a real browser. `lint`/`test`/`build` are
  # all structurally blind to a CSS-cascade or ARIA regression — the invisible
  # focus ring (0XC-111) passed every one of them — so this is the gate for that
  # class of defect. Hermetic: no backend, no database, no yt-dlp, no network
  # beyond localhost (the suite intercepts and aborts anything else).
  frontend-a11y:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Keyed on the lockfile because it pins the exact @playwright/test version,
      # which is what determines the browser build that gets downloaded.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend a11y suite
        working-directory: frontend
        run: npm test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
